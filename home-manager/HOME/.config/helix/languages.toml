# See: https://github.com/helix-editor/helix/issues/14380
[language-server.lean]
command = "lake"
args = ["serve"]

# From: https://writewithharper.com/docs/integrations/helix
[language-server.harper-ls]
command = "harper-ls"
args = ["--stdio"]

[[language]]
name = "markdown"
language-servers = ["harper-ls"]

# Enable soft-wrap for writing, wraps at 100 characters on wide screens.
soft-wrap.enable = true
text-width = 100
soft-wrap.wrap-at-text-width = true
